name: esme-recruitment

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      APP_DATA_DIR: /data
      DATABASE_PATH: /data/db/esme-recruitment.sqlite
      PRIVATE_UPLOADS_DIR: /data/uploads
      BACKUP_DIR: /data/backups
    env_file:
      - .env
    volumes:
      - app_data:/data
    expose:
      - "4000"
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  app_data:
  caddy_data:
  caddy_config:
